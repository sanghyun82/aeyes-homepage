<!DOCTYPE html>

<head>

  <meta name="robots" content="noindex">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0e0e0e;--line:rgba(255,255,255,.1);--text:#fff;--muted:#8a8a8a}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:"Pretendard",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:var(--text);background:var(--bg);line-height:1.75;word-break:keep-all;-webkit-font-smoothing:antialiased}
    a{color:#161616;text-decoration:underline;text-underline-offset:3px;text-decoration-color:rgba(0,0,0,.35)} a:hover{text-decoration-color:#161616}
    .container{width:min(860px,calc(100% - 40px));margin:0 auto;padding:44px 0 80px}
    .brand{display:flex;align-items:center;gap:12px;margin-bottom:44px;color:#fff;text-decoration:none}
    .brand img{width:40px;height:40px;border-radius:10px;border:1px solid rgba(255,255,255,.1)}
    .brand strong{display:block;font-family:"Poppins","Pretendard",sans-serif;font-size:1rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;line-height:1.1;color:#fff}
    .brand span span{display:block;margin-top:3px;font-size:.7rem;color:var(--muted);letter-spacing:.04em}
    .eyebrow{display:inline-flex;align-items:center;margin-bottom:20px;padding:7px 12px;border-radius:8px;background:#1f1f1f;color:#fff;font-family:"Poppins","Pretendard",sans-serif;font-size:.78rem;font-weight:500}
    h1{font-size:clamp(1.7rem,4vw,2.4rem);line-height:1.2;letter-spacing:-.03em;font-weight:600}
    .meta{margin-top:12px;color:var(--muted);font-size:.92rem}
    .card{margin-top:36px;padding:40px;border:1px solid #e3e3e4;border-radius:16px;background:#fff;color:#161616;box-shadow:0 30px 80px rgba(0,0,0,.5)}
    h2{margin:34px 0 12px;font-size:1.15rem;letter-spacing:-.02em;color:#161616}
    h2:first-child{margin-top:0}
    p,li{color:#454545;font-size:.96rem}
    ul{margin:10px 0 0 2px;list-style:none;display:grid;gap:8px}
    ul li{padding-left:18px;position:relative}
    ul li::before{content:"";position:absolute;left:0;top:.66em;width:7px;height:7px;border-radius:50%;background:#161616}
    strong{color:#161616}
    table{width:100%;margin-top:12px;border-collapse:collapse;font-size:.92rem}
    th,td{padding:12px 14px;border:1px solid #e3e3e4;text-align:left;vertical-align:top;color:#454545}
    th{background:#f7f7f9;color:#161616;font-size:.86rem;white-space:nowrap}
    .footer{margin-top:40px;padding-top:24px;border-top:1px solid var(--line);color:var(--muted);font-size:.88rem;display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between}
    .footer a{color:#fff;text-decoration-color:rgba(255,255,255,.4)} .footer a:hover{text-decoration-color:#fff}
    @media (max-width:600px){.card{padding:24px}}
    ol{margin:10px 0 0 22px;display:grid;gap:8px} ol li{padding-left:4px}
    .card p+p,.card p+ul,.card p+ol,.card ul+p,.card ol+p,.card table+p,.card p+table{margin-top:10px}
    .meta a{color:#fff;text-decoration-color:rgba(255,255,255,.4)} .meta a:hover{text-decoration-color:#fff}
    .card a{overflow-wrap:anywhere}
    .doc-list{display:grid;gap:22px} .doc-list h2{margin:0 0 6px} .doc-list p{margin:0}
    .table-wrap{margin-top:12px;overflow-x:auto;-webkit-overflow-scrolling:touch} .table-wrap table{margin-top:0}
    .table-wrap.wide table{min-width:560px} th{white-space:normal}
    @media (max-width:600px){th,td{padding:10px}}
  </style>
</head>
<body>
  <main class="container">
    <a class="brand" href="/" aria-label="AEYES 홈">

      <span><strong>AEYES Robotics</strong><span>Robotics Engineering Partner</span></span>
    </a>

    <span class="eyebrow">Privacy Policy</span>
    <h1>개인정보처리방침</h1>
    <p class="meta">주식회사 에이아이즈가 제공하는 소프트웨어별 개인정보처리방침입니다.</p>

      </div>
    </div>

    <div class="footer">
      <span>© 주식회사 에이아이즈. All rights reserved.</span>
      <a href="/">홈페이지로 돌아가기</a>
    </div>
  </main>
</body>
</html>
